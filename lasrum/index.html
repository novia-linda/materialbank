<!doctype html><html lang="sv" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11171f"><meta name="robots" content="noindex,nofollow"><title>Lindas läsrum</title></head><body>
<div id="auth" class="login"><p class="eyebrow">Ditt eget flöde</p><h1>Läsrummet</h1><p>En lugn plats för det du vill följa.</p><button id="googleLogin" class="primary google-login"><span aria-hidden="true">G</span> Fortsätt med Google</button><p id="authStatus" role="status">Startar…</p></div>
<div id="pending" class="login" hidden><p class="eyebrow">Läsrummet</p><h1>Väntar på godkännande</h1><p id="pendingMessage">Din förfrågan har skickats till Linda. Du kan återkomma hit när du fått klartecken.</p><button id="checkApproval" class="primary">Kontrollera igen</button><button id="pendingLogout" class="quiet">Logga ut</button></div>
<div id="denied" class="login" hidden><p class="eyebrow">Läsrummet</p><h1>Åtkomst nekad</h1><p>Kontot har inte fått tillträde till läsrummet.</p><button id="deniedLogout" class="primary">Logga ut</button></div>
<div id="session" class="syncbar" hidden><span id="syncStatus" role="status"></span><span><button id="retry" hidden>Försök spara igen</button> <button id="logout">Logga ut</button></span></div>
<div id="adminPanel" class="admin-panel" hidden><button id="managePeople" class="primary">Hantera åtkomst <span id="pendingCount"></span></button></div>
<div id="app" hidden></div>
<dialog id="adminDialog"><div class="admin-dialog-head"><h2>Förfrågningar</h2><button id="closeAdmin" aria-label="Stäng">×</button></div><p id="adminStatus" role="status"></p><div id="accessRequests"></div></dialog>
<script type="module" src="/src/main.js"></script></body></html>
